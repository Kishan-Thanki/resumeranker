<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ResumeRanker Privacy Policy. Learn how we handle your data, resume processing, API keys, and security practices.">
    <title>ResumeRanker | Privacy Policy</title>
    <script>
        (function() {
            var t = localStorage.getItem('data-theme');
            if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="/assets/js/vendor/marked.min.js"></script>
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>

    <nav class="navbar" role="navigation" aria-label="Main navigation">
        <div class="nav-brand"><a href="/">ResumeRanker</a></div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/auth/login" id="navLoginBtn">Sign In</a>
            <a href="/dashboard/dashboard" id="navDashBtn" class="hidden">Dashboard</a>
            <a href="#" id="navLogout" class="hidden">Logout</a>
        </div>
        <div class="nav-actions">
            <button class="theme-toggle" id="themeToggleBtn" aria-label="Toggle theme">
                <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
            <button class="nav-hamburger" id="navHamburger" aria-label="Toggle menu" aria-expanded="false">
                <span></span>
            </button>
        </div>
    </nav>

    <div class="main-content content-page" id="main" style="max-width: 800px; margin: 0 auto; padding: 4rem 1rem;">
        <h1 style="font-size: 2rem; margin-bottom: 0.5rem;">Privacy Policy</h1>
        <p style="color: var(--text-secondary); margin-bottom: 3rem; font-size: 0.875rem;">Last updated 2026-05-19</p>

        <div id="privacyContent" class="content-body" style="line-height: 1.7;">
            <p>Loading privacy policy...</p>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <div>&copy; 2026 ResumeRanker. All rights reserved.</div>
            <div class="footer-links">
                <a href="/about">About</a>
                <a href="/contact">Contact</a>
                <a href="/legal/terms">Terms of Service</a>
                <a href="/legal/privacy">Privacy Policy</a>
            </div>
        </div>
    </footer>

    <script type="module" src="/assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const contentDiv = document.getElementById('privacyContent');
            try {
                const res = await fetch('/api/v1/agreements/latest');
                if (!res.ok) throw new Error('Failed to load privacy policy');
                const agreements = await res.json();
                
                const policy = agreements.find(a => a.type === 'privacy_policy');
                if (policy && policy.content) {
                    contentDiv.innerHTML = marked.parse(policy.content);
                    contentDiv.querySelectorAll('h2').forEach(el => {
                        el.style.fontSize = '1.25rem';
                        el.style.marginBottom = '1rem';
                        el.style.marginTop = '2rem';
                    });
                    contentDiv.querySelectorAll('p, ul, li').forEach(el => {
                        el.style.color = 'var(--text-secondary)';
                    });
                    contentDiv.querySelectorAll('ul').forEach(el => {
                        el.style.marginLeft = '1.5rem';
                        el.style.marginTop = '0.5rem';
                        el.style.marginBottom = '1rem';
                    });
                } else {
                    contentDiv.innerHTML = '<p class="text-danger">Privacy policy not found.</p>';
                }
            } catch (err) {
                contentDiv.innerHTML = `<p class="text-danger">Error: ${err.message}</p>`;
            }
        });
    </script>
</body>
</html>
