<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResumeRanker | Analysis Report</title>
    <script>
        (function() {
            var t = localStorage.getItem('data-theme');
            if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>

    <nav class="navbar" role="navigation" aria-label="Main navigation">
        <div class="nav-brand">
            <a href="/">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="brand-icon"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>
                <span style="background: linear-gradient(to right, var(--text-primary), var(--text-muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">ResumeRanker</span>
            </a>
        </div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
            <a href="/docs/public" target="_blank" rel="noopener">API Docs</a>
        </div>
        <div class="nav-actions">
            <a href="/auth/login" id="navLoginBtn" class="btn btn-primary" style="padding: 0.5rem 1rem; font-size: 0.875rem;">Log In</a>
            <a href="/dashboard" id="navDashBtn" class="btn btn-primary hidden" style="padding: 0.5rem 1rem; font-size: 0.875rem;">Dashboard</a>
            <a href="#" id="navLogout" class="btn btn-secondary hidden" style="padding: 0.5rem 1rem; font-size: 0.875rem;">Logout</a>
            <button class="theme-toggle" id="themeToggleBtn" aria-label="Toggle theme">
                <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
            <button class="nav-hamburger" id="navHamburger" aria-label="Toggle menu" aria-expanded="false">
                <span></span>
            </button>
        </div>
    </nav>

    <div class="main-content" id="main">
        <div class="report-header" style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem;">
            <a href="/dashboard/history" class="btn btn-secondary btn-sm" style="margin-top: 0.5rem;">&larr; Back to History</a>
            <div style="text-align: center;">
                <h2 id="reportTitle" style="margin: 0;">Analysis Report</h2>
                <div id="reportSubtitle" class="text-muted mt-2" style="font-size: 0.95rem; font-weight: 500;"></div>
            </div>
            <div style="width: 100px;"></div>
        </div>
        
        <div id="reportContent">
            <div class="loader-ring" style="margin: 40px auto;"></div>
        </div>
    </div>
    <script type="module" src="/assets/js/report.js"></script>
</body>
</html>
