<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a ResumeRanker account to get your API key and start integrating AI-powered resume parsing into your workflow.">
    <title>ResumeRanker | Create Account</title>
    <script>
        (function() {
            var t = localStorage.getItem('data-theme');
            if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <a href="#main" class="skip-link">Skip to content</a>

    <nav class="navbar" role="navigation" aria-label="Main navigation">
        <div class="nav-brand"><a href="/">ResumeRanker</a></div>
        <div class="nav-links">
            <a href="/docs/public" target="_blank" rel="noopener">API Docs</a>
            <a href="/auth/login">Sign In</a>
        </div>
        <div class="nav-actions">
            <button class="theme-toggle" id="themeToggleBtn" aria-label="Toggle theme">
                <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
            <button class="nav-hamburger" id="navHamburger" aria-label="Toggle menu" aria-expanded="false">
                <span></span>
            </button>
        </div>
    </nav>

    <div class="auth-layout" id="main">
        <div class="auth-card">
            <h2>Create Account</h2>
            <p>Join developers building the future of ATS.</p>
            <form id="registerForm">
                <div class="form-group">
                    <label for="registerEmail">Email Address</label>
                    <input type="email" id="registerEmail" class="form-control" required placeholder="developer@company.com" autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" class="form-control" required placeholder="••••••••" minlength="8" autocomplete="new-password">
                    <span class="form-hint">Minimum 8 characters.</span>
                </div>
                <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="registerTerms" required>
                    <label for="registerTerms" style="font-weight: 400; font-size: 0.875rem; margin-bottom: 0;">I accept the <a href="/legal/terms">Terms of Service</a> and <a href="/legal/privacy">Privacy Policy</a></label>
                </div>
                <div id="registerError" class="alert alert-error hidden">Registration failed.</div>
                <button type="submit" class="btn btn-primary btn-lg btn-full mt-2" id="registerSubmitBtn">
                    <span class="btn-text">Create Account</span>
                    <span class="loader hidden"></span>
                </button>
            </form>
            <p class="auth-footer-text">
                Already have an account? <a href="/auth/login">Sign In</a>
            </p>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <div>&copy; 2026 ResumeRanker. All rights reserved.</div>
            <div class="footer-links">
                <a href="/about">About</a>
                <a href="/contact">Contact</a>
                <a href="/legal/terms">Terms of Service</a>
                <a href="/legal/privacy">Privacy Policy</a>
            </div>
        </div>
    </footer>

    <script type="module" src="/assets/js/auth.js"></script>
</body>
</html>
