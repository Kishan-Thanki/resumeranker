<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResumeRanker | Reset Password</title>
    <script>
        (function() {
            var t = localStorage.getItem('data-theme');
            if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
    <nav class="navbar" role="navigation" aria-label="Main navigation">
        <div class="nav-brand">
            <a href="/">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="brand-icon"><path d="M12 2L2 7l10 5 10-5-10-5z"></path><path d="M2 17l10 5 10-5"></path><path d="M2 12l10 5 10-5"></path></svg>
                <span style="background: linear-gradient(to right, var(--text-primary), var(--text-muted)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">ResumeRanker</span>
            </a>
        </div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/contact">Contact</a>
        </div>
        <div class="nav-actions">
            <a href="/auth/login" class="btn btn-primary" style="padding: 0.5rem 1rem; font-size: 0.875rem;">Log In</a>
        </div>
    </nav>

    <div class="auth-layout" id="main">
        <div class="auth-card">
            <h2>Reset Password</h2>
            <p>Enter your new password below.</p>
            
            <div id="resetError" class="alert alert-error hidden"></div>
            <div id="resetSuccess" class="alert alert-success hidden">Your password has been successfully reset!</div>

            <form id="resetForm">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" class="form-control" required placeholder="••••••••" minlength="8">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <input type="password" id="confirmPassword" class="form-control" required placeholder="••••••••" minlength="8">
                </div>
                <button type="submit" class="btn btn-primary btn-lg btn-full mt-2" id="resetSubmitBtn">
                    <span class="btn-text">Reset Password</span>
                    <span class="loader hidden"></span>
                </button>
            </form>
            
            <a href="/auth/login" class="btn btn-secondary btn-lg btn-full mt-2 hidden" id="resetLoginBtn">
                <span class="btn-text">Proceed to Login</span>
            </a>
        </div>
    </div>

    <script type="module">
        import { apiCall } from '/assets/js/api.js';
        
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const errorEl = document.getElementById('resetError');
            
            if (!token) {
                errorEl.textContent = 'No reset token provided in the URL.';
                errorEl.classList.remove('hidden');
                document.getElementById('resetForm').classList.add('hidden');
                return;
            }

            const form = document.getElementById('resetForm');
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                const submitBtn = document.getElementById('resetSubmitBtn');
                const btnText = submitBtn.querySelector('.btn-text');
                const loader = submitBtn.querySelector('.loader');

                errorEl.classList.add('hidden');

                if (newPassword !== confirmPassword) {
                    errorEl.textContent = 'Passwords do not match.';
                    errorEl.classList.remove('hidden');
                    return;
                }
                
                if (newPassword.length < 8) {
                    errorEl.textContent = 'Password must be at least 8 characters.';
                    errorEl.classList.remove('hidden');
                    return;
                }

                btnText.classList.add('hidden');
                loader.classList.remove('hidden');
                submitBtn.disabled = true;

                try {
                    const res = await apiCall('/users/password/reset', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: token, new_password: newPassword })
                    });

                    if (!res.ok) {
                        let errMsg = 'Password reset failed. The link may have expired.';
                        try {
                            const data = await res.json();
                            errMsg = data.error || errMsg;
                        } catch(e) {}
                        throw new Error(errMsg);
                    }

                    form.classList.add('hidden');
                    document.getElementById('resetSuccess').classList.remove('hidden');
                    document.getElementById('resetLoginBtn').classList.remove('hidden');
                    
                } catch (err) {
                    errorEl.textContent = err.message;
                    errorEl.classList.remove('hidden');
                    btnText.classList.remove('hidden');
                    loader.classList.add('hidden');
                    submitBtn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
