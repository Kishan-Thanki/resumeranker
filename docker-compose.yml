services:
  analysis:
    build: ./analysis
    env_file:
      - ./analysis/env/dev.env
    ports:
      - "8001:8001"
    restart: unless-stopped

  database:
    build: ./database
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resumeranker
    ports:
      - "5432:5432"
    volumes:
      - resumeranker-pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 5

  migrate:
    image: migrate/migrate
    volumes:
      - ./api/migrations:/migrations
    command: -path=/migrations -database "postgres://postgres:postgres@database:5432/resumeranker?sslmode=disable" up
    depends_on:
      database:
        condition: service_healthy

  api:
    build: ./api
    env_file:
      - ./api/env/dev.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@database:5432/resumeranker?sslmode=disable
      ANALYSIS_SERVICE_URL: analysis:8001
    ports:
      - "9080:8080"
    depends_on:
      database:
        condition: service_healthy
      analysis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build: ./web
    environment:
      DOMAIN: "localhost:80"
      API_UPSTREAM: "api:8080"
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  resumeranker-pgdata:
