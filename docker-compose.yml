
services:
  analysis:
    build:
      context: ./analysis
      dockerfile: Dockerfile
    image: resumeranker-analysis:latest
    container_name: resumeranker-analysis
    env_file:
      - ./analysis/.env
    expose:
      - "50051"
    networks:
      - resumeranker-net
    restart: unless-stopped

  analysis-dashboard:
    build:
      context: ./analysis_dashboard
      dockerfile: Dockerfile
    image: resumeranker-analysis-dashboard:latest
    container_name: resumeranker-analysis-dashboard
    env_file:
      - ./analysis_dashboard/.env
    ports:
      - "8501:8501"
    depends_on:
      - analysis
    networks:
      - resumeranker-net
    restart: unless-stopped

networks:
  resumeranker-net:
    name: resumeranker-net
    driver: bridge
