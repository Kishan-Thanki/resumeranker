
services:
  analysis:
    build:
      context: ./analysis
      dockerfile: Dockerfile
    image: resumeranker-analysis:latest
    container_name: resumeranker-analysis
    env_file:
      - ./analysis/.env
    expose:
      - "50051"
    networks:
      - resumeranker-net
    restart: unless-stopped

  analysis-dashboard:
    build:
      context: ./analysis_dashboard
      dockerfile: Dockerfile
    image: resumeranker-analysis-dashboard:latest
    container_name: resumeranker-analysis-dashboard
    env_file:
      - ./analysis_dashboard/.env
    ports:
      - "8501:8501"
    depends_on:
      - analysis
    networks:
      - resumeranker-net
    restart: unless-stopped

  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    image: resumeranker-proxy:latest
    container_name: resumeranker-proxy
    environment:
      - DASHBOARD_DOMAIN=localhost
      - DASHBOARD_UPSTREAM=analysis-dashboard:8501
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - analysis-dashboard
    networks:
      - resumeranker-net
    restart: unless-stopped

networks:
  resumeranker-net:
    name: resumeranker-net
    driver: bridge
