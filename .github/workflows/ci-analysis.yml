name: CI Analysis Service

on:
  pull_request:
    branches: [main]
    paths:
      - "analysis/**"
      - ".github/workflows/ci-analysis.yml"

jobs:
  test-analysis:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: analysis
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Project Dependencies
        run: |
          uv sync --frozen

      - name: Run Pytest Test Suite
        run: |
          uv run pytest tests/
