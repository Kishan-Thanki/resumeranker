name: Build Analysis Artifact

on:
  push:
    tags:
      - "analysis-v*"

permissions:
  contents: write

jobs:
  build-analysis-artifact:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Analysis Release Tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^analysis-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid analysis production release tag: $TAG"
            echo "Expected format: analysis-vX.Y.Z"
            exit 1
          fi

          echo "Valid analysis production release tag: $TAG"

      - name: Validate Analysis Release Inputs
        run: |
          set -euo pipefail

          required_files=(
            "analysis/Dockerfile"
            "analysis/LICENSE"
            "analysis/pyproject.toml"
            "analysis/uv.lock"
            "analysis/app/__init__.py"
            "analysis/app/main.py"
            "analysis/app/servicer.py"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "ERROR: Required file missing: $file"
              exit 1
            fi
          done

          echo "All required analysis release inputs are present."

      - name: Package Analysis Artifact
        run: |
          set -euo pipefail

          rm -rf build_stage
          rm -f analysis-artifact.tar.gz
          rm -f analysis-artifact.tar.gz.sha256

          mkdir -p build_stage/analysis

          cp -r analysis/app build_stage/analysis/
          cp -r analysis/scripts build_stage/analysis/
          cp analysis/Dockerfile build_stage/analysis/
          cp analysis/LICENSE build_stage/analysis/
          cp analysis/pyproject.toml build_stage/analysis/
          cp analysis/uv.lock build_stage/analysis/

          find build_stage/analysis \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          find build_stage/analysis \
            -type f \
            \( -name "*.pyc" -o -name "*.pyo" \) \
            -delete

          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf analysis-artifact.tar.gz \
            -C build_stage \
            analysis/

          sha256sum analysis-artifact.tar.gz \
            > analysis-artifact.tar.gz.sha256

      - name: Verify Analysis Artifact
        run: |
          set -euo pipefail

          sha256sum -c analysis-artifact.tar.gz.sha256

          tar -tzf analysis-artifact.tar.gz \
            > /tmp/analysis-artifact-files.txt

          if grep -E '(^|/)(__pycache__|[^/]+\.pyc|[^/]+\.pyo)($|/)' \
              /tmp/analysis-artifact-files.txt; then
            echo "ERROR: Python cache files were included."
            exit 1
          fi

          if grep -E '(^|/)\.env($|/)' \
              /tmp/analysis-artifact-files.txt; then
            echo "ERROR: .env file was included."
            exit 1
          fi

          if grep -E '^analysis/tests/' \
              /tmp/analysis-artifact-files.txt; then
            echo "ERROR: Tests were included in production artifact."
            exit 1
          fi

          if grep -E '^analysis/examples/' \
              /tmp/analysis-artifact-files.txt; then
            echo "ERROR: Examples were included in production artifact."
            exit 1
          fi

          grep -q '^analysis/app/' \
            /tmp/analysis-artifact-files.txt

          grep -q '^analysis/scripts/' \
            /tmp/analysis-artifact-files.txt

          grep -q '^analysis/Dockerfile$' \
            /tmp/analysis-artifact-files.txt

          grep -q '^analysis/LICENSE$' \
            /tmp/analysis-artifact-files.txt

          grep -q '^analysis/pyproject.toml$' \
            /tmp/analysis-artifact-files.txt

          grep -q '^analysis/uv.lock$' \
            /tmp/analysis-artifact-files.txt

          echo "Analysis artifact verification passed."

      - name: Create GitHub Release & Upload Artifact
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            analysis-artifact.tar.gz
            analysis-artifact.tar.gz.sha256
          fail_on_unmatched_files: true
          body: |
            Automated production artifact for analysis service release ${{ github.ref_name }}
