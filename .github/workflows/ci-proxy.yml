name: CI Proxy

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "proxy/Caddyfile"
      - ".github/workflows/ci-proxy.yml"

permissions:
  contents: read

jobs:
  validate-caddy-config:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Confirm Caddy config is present
        run: |
          pwd
          ls -la proxy
          test -f proxy/Caddyfile

      - name: Validate Caddyfile
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/proxy:/etc/caddy:ro" \
            caddy:2 \
            caddy validate \
            --config /etc/caddy/Caddyfile \
            --adapter caddyfile

      - name: Confirm Caddy config is valid
        run: |
          echo "Caddy configuration file is present and valid."
