name: CI Web Service

on:
  pull_request:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/ci-web.yml"

jobs:
  validate-web:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Validate Web Directory Structure
        run: |
          set -euo pipefail

          test -d web/public

          test -f web/public/index.html
          test -f web/public/about.html
          test -f web/public/contact.html
          test -f web/public/error.html
          test -f web/public/reset-password.html
          test -f web/public/verify.html

          test -d web/public/auth
          test -f web/public/auth/login.html
          test -f web/public/auth/register.html

          test -d web/public/dashboard
          test -f web/public/dashboard/index.html
          test -f web/public/dashboard/account.html
          test -f web/public/dashboard/analyze.html
          test -f web/public/dashboard/guide.html
          test -f web/public/dashboard/history.html
          test -f web/public/dashboard/report.html
          test -f web/public/dashboard/usage.html

          test -d web/public/legal
          test -f web/public/legal/privacy.html
          test -f web/public/legal/terms.html

          test -d web/public/assets/css
          test -d web/public/assets/js
          test -d web/public/assets/pdf

          echo "Web directory structure validated."

      - name: Validate HTML Files
        run: |
          set -euo pipefail

          mapfile -t HTML_FILES < <(
            find web/public \
              -type f \
              -name "*.html" \
              -print
          )

          if [[ "${#HTML_FILES[@]}" -eq 0 ]]; then
            echo "ERROR: No HTML files found."
            exit 1
          fi

          for file in "${HTML_FILES[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "ERROR: Empty HTML file: $file"
              exit 1
            fi
          done

          echo "Validated ${#HTML_FILES[@]} HTML files."

      - name: Validate JavaScript Files
        run: |
          set -euo pipefail

          mapfile -t JS_FILES < <(
            find web/public/assets/js \
              -type f \
              -name "*.js" \
              -not -path "*/vendor/*" \
              -print
          )

          if [[ "${#JS_FILES[@]}" -eq 0 ]]; then
            echo "ERROR: No application JavaScript files found."
            exit 1
          fi

          for file in "${JS_FILES[@]}"; do
            echo "Checking JavaScript syntax: $file"
            node --check "$file"
          done

          echo "Validated ${#JS_FILES[@]} JavaScript files."

      - name: Validate CSS Files
        run: |
          set -euo pipefail

          test -s web/public/assets/css/style.css
          test -s web/public/assets/css/usage.css

          echo "CSS files validated."

      - name: Validate Required PDF Assets
        run: |
          set -euo pipefail

          test -s web/public/assets/pdf/job_description_1.pdf
          test -s web/public/assets/pdf/job_description_2.pdf
          test -s web/public/assets/pdf/job_description_3.pdf

          test -s web/public/assets/pdf/resume_1.pdf
          test -s web/public/assets/pdf/resume_2.pdf
          test -s web/public/assets/pdf/resume_3.pdf

          echo "Required PDF assets validated."

      - name: Check for Unexpected Repository Files in Public
        run: |
          set -euo pipefail

          if find web/public \
            -type f \
            \( \
              -name ".env" \
              -o -name "*.pyc" \
              -o -name "*.pyo" \
            \) \
            -print -quit | grep -q .; then

            echo "ERROR: Unexpected development/runtime files found in web/public."
            find web/public \
              -type f \
              \( \
                -name ".env" \
                -o -name "*.pyc" \
                -o -name "*.pyo" \
              \) \
              -print

            exit 1
          fi

          echo "No unexpected development/runtime files found."

      - name: Validate Web CI
        run: |
          set -euo pipefail

          echo "Web CI validation completed successfully."
