name: Build API Artifact

on:
  push:
    tags:
      - "api-v*"

permissions:
  contents: write

jobs:
  build-api:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate API Release Tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^api-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid API production release tag: $TAG"
            echo "Expected format: api-vX.Y.Z"
            exit 1
          fi

          echo "Valid API production release tag: $TAG"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache-dependency-path: api/go.sum

      - name: Download Go Dependencies
        working-directory: api
        run: |
          go mod download

      - name: Compile Production Go Binary
        working-directory: api
        run: |
          set -euo pipefail

          mkdir -p bin

          CGO_ENABLED=0 \
          GOOS=linux \
          GOARCH=amd64 \
          go build \
            -o bin/api \
            ./cmd/api

          test -s bin/api

      - name: Validate API Runtime Files
        run: |
          set -euo pipefail

          test -f api/bin/api
          test -d api/migrations

          echo "api/.env is intentionally NOT included in the artifact."

      - name: Package Clean API Artifact
        run: |
          set -euo pipefail

          rm -rf build_stage
          rm -f api-artifact.tar.gz
          rm -f api-artifact.tar.gz.sha256

          mkdir -p build_stage/api

          cp api/bin/api build_stage/api/
          cp -r api/migrations build_stage/api/

          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf api-artifact.tar.gz \
            -C build_stage \
            api/

          sha256sum api-artifact.tar.gz \
            > api-artifact.tar.gz.sha256

      - name: Verify API Artifact
        run: |
          set -euo pipefail

          sha256sum -c api-artifact.tar.gz.sha256

          tar -tzf api-artifact.tar.gz \
            > /tmp/api-artifact-files.txt

          grep -q '^api/api$' \
            /tmp/api-artifact-files.txt

          grep -q '^api/migrations/' \
            /tmp/api-artifact-files.txt

          if grep -qE '(^|/)\.env$' \
              /tmp/api-artifact-files.txt; then
            echo "ERROR: .env was included in the production artifact."
            exit 1
          fi

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            api-artifact.tar.gz
            api-artifact.tar.gz.sha256
          body: |
            Automated production build for API service release ${{ github.ref_name }}
