name: Resume Ranker Web Service

on:
  release:
    types:
      - published

  workflow_dispatch:
    inputs:
      version_tag:
        description: "Web version tag to deploy (e.g., web-v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

env:
  SERVICE_NAME: "resumeranker-web"
  SYSTEMD_SERVICE: "resumeranker-web.service"
  HEALTH_URL: "https://resumeranker.kishanthanki.space/"
  ARTIFACT_NAME: "web-artifact.tar.gz"
  CHECKSUM_NAME: "web-artifact.tar.gz.sha256"

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Resolve Deployment Version
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.version_tag }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "release" ]]; then
            TAG="$RELEASE_TAG"
          else
            TAG="$INPUT_TAG"
          fi

          if [[ -z "$TAG" ]]; then
            echo "ERROR: Deployment version tag is empty."
            exit 1
          fi

          echo "VERSION=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved production deployment version: $TAG"

      - name: Validate Web Production Release Tag
        env:
          TAG: ${{ steps.context.outputs.VERSION }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^web-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid web production tag: $TAG"
            echo "Expected format: web-vX.Y.Z"
            exit 1
          fi

          echo "Web production tag validated: $TAG"

      - name: Download Exact Web Release Artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.context.outputs.VERSION }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          echo "Downloading release artifact for: $VERSION"

          gh release download "$VERSION" \
            --repo "$REPO" \
            --pattern "$ARTIFACT_NAME"

          gh release download "$VERSION" \
            --repo "$REPO" \
            --pattern "$CHECKSUM_NAME"

          if [[ ! -f "$ARTIFACT_NAME" ]]; then
            echo "ERROR: Required artifact not found:"
            echo "  $ARTIFACT_NAME"
            exit 1
          fi

          if [[ ! -f "$CHECKSUM_NAME" ]]; then
            echo "ERROR: Required checksum file not found:"
            echo "  $CHECKSUM_NAME"
            exit 1
          fi

          echo "Release files downloaded successfully:"
          ls -lh "$ARTIFACT_NAME" "$CHECKSUM_NAME"

      - name: Validate Checksum File
        run: |
          set -euo pipefail

          echo "Validating checksum file..."

          CHECKSUM="$(awk 'NF >= 1 {print $1; exit}' "$CHECKSUM_NAME")"

          if [[ ! "$CHECKSUM" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "ERROR: Invalid SHA256 checksum."
            exit 1
          fi

          echo "SHA256_HASH=$CHECKSUM" >> "$GITHUB_ENV"

          echo "Checksum format validated."

      - name: Verify Artifact SHA256
        run: |
          set -euo pipefail

          echo "Verifying web artifact checksum..."

          sha256sum -c "$CHECKSUM_NAME"

          echo "Web artifact SHA256 verification passed."

      - name: Configure SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.WEB_SSH_PRIVATE_KEY }}

      - name: Securely Trust Remote Host
        env:
          SSH_HOST: ${{ secrets.WEB_SSH_HOST }}
        run: |
          set -euo pipefail

          if [[ -z "$SSH_HOST" ]]; then
            echo "ERROR: WEB_SSH_HOST secret is not configured."
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

          if [[ ! -s "$HOME/.ssh/known_hosts" ]]; then
            echo "ERROR: Failed to establish SSH host trust."
            exit 1
          fi

          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload Artifact to Target Server
        env:
          SSH_HOST: ${{ secrets.WEB_SSH_HOST }}
        run: |
          set -euo pipefail

          echo "Uploading verified web artifact..."

          scp \
            "$ARTIFACT_NAME" \
            "deploy@${SSH_HOST}:/home/deploy/artifact.tar.gz"

          echo "Artifact uploaded successfully."

      - name: Execute Server Deployment Engine
        env:
          VERSION: ${{ steps.context.outputs.VERSION }}
          CHECKSUM: ${{ env.SHA256_HASH }}
          SSH_HOST: ${{ secrets.WEB_SSH_HOST }}
          SERVICE_NAME: ${{ env.SERVICE_NAME }}
          SYSTEMD_SERVICE: ${{ env.SYSTEMD_SERVICE }}
          HEALTH_URL: ${{ env.HEALTH_URL }}
        run: |
          set -euo pipefail

          echo "Triggering remote deployment engine..."

          ssh "deploy@${SSH_HOST}" << 'EOF'
            set -euo pipefail

            /opt/platform/deploy.sh \
              --service "${SERVICE_NAME}" \
              --version "${VERSION}" \
              --artifact "/home/deploy/artifact.tar.gz" \
              --sha256 "${CHECKSUM}" \
              --systemd "${SYSTEMD_SERVICE}" \
              --health "${HEALTH_URL}"

            rm -f /home/deploy/artifact.tar.gz
          EOF

      - name: Cleanup Runner Artifacts
        if: always()
        run: |
          rm -f \
            "$ARTIFACT_NAME" \
            "$CHECKSUM_NAME"
