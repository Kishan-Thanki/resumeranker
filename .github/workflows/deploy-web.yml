name: Deploy Resume Ranker Web Service

on:
  release:
    types:
      - published

  workflow_dispatch:
    inputs:
      version_tag:
        description: "Web version tag to deploy (e.g., web-v0.0.7)"
        required: true
        type: string

permissions:
  contents: read

env:
  SERVICE_NAME: "resumeranker-web"
  SYSTEMD_SERVICE: "caddy"
  HEALTH_URL: "https://resumeranker.kishanthanki.space/"
  ARTIFACT_NAME: "web-artifact.tar.gz"
  CHECKSUM_NAME: "web-artifact.tar.gz.sha256"

  DEPLOY_USER: "deploy"
  DEPLOY_ENGINE: "/opt/platform/deploy.sh"

jobs:
  deploy:
    name: Deploy production web release
    runs-on: ubuntu-24.04

    steps:
      # ====================================================================
      # 1. Resolve deployment version
      # ====================================================================

      - name: Resolve Deployment Version
        id: context
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.version_tag }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "release" ]]; then
            TAG="$RELEASE_TAG"
          else
            TAG="$INPUT_TAG"
          fi

          if [[ -z "$TAG" ]]; then
            echo "ERROR: Deployment version tag is empty."
            exit 1
          fi

          echo "VERSION=$TAG" >> "$GITHUB_OUTPUT"

          echo "Resolved deployment version:"
          echo "  $TAG"

      # ====================================================================
      # 2. Validate production web tag
      # ====================================================================

      - name: Validate Web Production Release Tag
        env:
          TAG: ${{ steps.context.outputs.VERSION }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^web-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid web production tag:"
            echo "  $TAG"
            echo
            echo "Expected format: web-vX.Y.Z"
            exit 1
          fi

          echo "Web production tag validated:"
          echo "  $TAG"

      # ====================================================================
      # 3. Validate deployment configuration
      # ====================================================================

      - name: Validate Deployment Configuration
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "$SERVICE_NAME" ]] || {
            echo "ERROR: SERVICE_NAME is empty."
            exit 1
          }

          [[ "$SYSTEMD_SERVICE" == "caddy" ]] || {
            echo "ERROR: SYSTEMD_SERVICE must be 'caddy'."
            exit 1
          }

          [[ "$HEALTH_URL" == https://* ]] || {
            echo "ERROR: HEALTH_URL must use HTTPS."
            exit 1
          }

          [[ -n "$ARTIFACT_NAME" ]] || {
            echo "ERROR: ARTIFACT_NAME is empty."
            exit 1
          }

          [[ -n "$CHECKSUM_NAME" ]] || {
            echo "ERROR: CHECKSUM_NAME is empty."
            exit 1
          }

          [[ "$ARTIFACT_NAME" != */* ]] || {
            echo "ERROR: ARTIFACT_NAME must be a filename."
            exit 1
          }

          [[ "$CHECKSUM_NAME" != */* ]] || {
            echo "ERROR: CHECKSUM_NAME must be a filename."
            exit 1
          }

          echo "Deployment configuration validated."

      # ====================================================================
      # 4. Download exact release artifact
      # ====================================================================

      - name: Download Exact Web Release Artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.context.outputs.VERSION }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloading release:"
          echo "  $VERSION"

          echo "Artifact:"
          echo "  $ARTIFACT_NAME"

          echo "Checksum:"
          echo "  $CHECKSUM_NAME"

          gh release download "$VERSION" \
            --repo "$REPO" \
            --pattern "$ARTIFACT_NAME"

          gh release download "$VERSION" \
            --repo "$REPO" \
            --pattern "$CHECKSUM_NAME"

          [[ -f "$ARTIFACT_NAME" ]] || {
            echo "ERROR: Release artifact not found:"
            echo "  $ARTIFACT_NAME"
            exit 1
          }

          [[ -f "$CHECKSUM_NAME" ]] || {
            echo "ERROR: Release checksum not found:"
            echo "  $CHECKSUM_NAME"
            exit 1
          }

          echo "Release files downloaded."

          ls -lh \
            "$ARTIFACT_NAME" \
            "$CHECKSUM_NAME"

      # ====================================================================
      # 5. Validate checksum metadata
      # ====================================================================

      - name: Validate SHA256 Checksum
        shell: bash
        run: |
          set -euo pipefail

          CHECKSUM="$(
            awk '
              NF >= 1 {
                print $1
                exit
              }
            ' "$CHECKSUM_NAME"
          )"

          if [[ ! "$CHECKSUM" =~ ^[A-Fa-f0-9]{64}$ ]]; then
            echo "ERROR: Invalid SHA256 checksum."
            exit 1
          fi

          echo "SHA256_HASH=$CHECKSUM" >> "$GITHUB_ENV"

          echo "SHA256 checksum format validated."

      # ====================================================================
      # 6. Verify artifact checksum
      # ====================================================================

      - name: Verify Artifact SHA256
        shell: bash
        run: |
          set -euo pipefail

          printf '%s  %s\n' \
            "$SHA256_HASH" \
            "$ARTIFACT_NAME" |
            sha256sum -c -

          echo "Web artifact SHA256 verification passed."

      # ====================================================================
      # 7. Configure deployment SSH agent
      # ====================================================================

      - name: Configure Deployment SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.WEB_SSH_PRIVATE_KEY }}

      # ====================================================================
      # 8. Configure pinned SSH host trust
      # ====================================================================

      - name: Configure SSH Host Trust
        env:
          SSH_KNOWN_HOSTS: ${{ secrets.WEB_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "$SSH_KNOWN_HOSTS" ]] || {
            echo "ERROR: WEB_SSH_KNOWN_HOSTS is not configured."
            exit 1
          }

          mkdir -p "$HOME/.ssh"

          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"

          chmod 600 "$HOME/.ssh/known_hosts"

          echo "Pinned SSH host trust configured."

      # ====================================================================
      # 9. Verify deployment SSH access
      # ====================================================================

      - name: Verify Deployment SSH Access
        env:
          SSH_HOST: ${{ secrets.WEB_SSH_HOST }}
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "$SSH_HOST" ]] || {
            echo "ERROR: WEB_SSH_HOST is not configured."
            exit 1
          }

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${SSH_HOST}" \
            'printf "Deployment SSH authentication successful.\n"'

          echo "Deployment SSH access verified."

      # ====================================================================
      # 10. Generate unique remote artifact path
      # ====================================================================

      - name: Prepare Remote Artifact Path
        id: remote
        shell: bash
        run: |
          set -euo pipefail

          REMOTE_ARTIFACT="/home/deploy/.deploy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"

          echo "REMOTE_ARTIFACT=$REMOTE_ARTIFACT" \
            >> "$GITHUB_OUTPUT"

          echo "Remote artifact:"
          echo "  $REMOTE_ARTIFACT"

      # ====================================================================
      # 11. Upload verified artifact
      # ====================================================================

      - name: Upload Verified Artifact
        env:
          SSH_HOST: ${{ secrets.WEB_SSH_HOST }}
          REMOTE_ARTIFACT: ${{ steps.remote.outputs.REMOTE_ARTIFACT }}
        shell: bash
        run: |
          set -euo pipefail

          scp \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$ARTIFACT_NAME" \
            "${DEPLOY_USER}@${SSH_HOST}:${REMOTE_ARTIFACT}"

          echo "Verified artifact uploaded."

      # ====================================================================
      # 12. Execute server-side deployment engine
      # ====================================================================

      - name: Execute Server Deployment Engine
        env:
          VERSION: ${{ steps.context.outputs.VERSION }}
          CHECKSUM: ${{ env.SHA256_HASH }}
          SSH_HOST: ${{ secrets.WEB_SSH_HOST }}
          REMOTE_ARTIFACT: ${{ steps.remote.outputs.REMOTE_ARTIFACT }}
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${SSH_HOST}" \
            bash -s \
            -- \
            "$SERVICE_NAME" \
            "$VERSION" \
            "$REMOTE_ARTIFACT" \
            "$CHECKSUM" \
            "$SYSTEMD_SERVICE" \
            "$HEALTH_URL" \
            "$DEPLOY_ENGINE" <<'REMOTE_SCRIPT'

          set -euo pipefail

          SERVICE_NAME="$1"
          VERSION="$2"
          ARTIFACT="$3"
          CHECKSUM="$4"
          SYSTEMD_SERVICE="$5"
          HEALTH_URL="$6"
          DEPLOY_ENGINE="$7"

          if [[ ! -f "$ARTIFACT" ]]; then
              echo "ERROR: Remote artifact does not exist:"
              echo "  $ARTIFACT"
              exit 1
          fi

          if [[ ! -x "$DEPLOY_ENGINE" ]]; then
              echo "ERROR: Deployment engine is missing or not executable:"
              echo "  $DEPLOY_ENGINE"
              exit 1
          fi

          "$DEPLOY_ENGINE" \
            --service "$SERVICE_NAME" \
            --version "$VERSION" \
            --artifact "$ARTIFACT" \
            --sha256 "$CHECKSUM" \
            --systemd "$SYSTEMD_SERVICE" \
            --health "$HEALTH_URL"

          REMOTE_SCRIPT

          echo "Server-side deployment completed."

      # ====================================================================
      # 13. Cleanup remote artifact
      # ====================================================================

      - name: Cleanup Remote Artifact
        if: always()
        env:
          SSH_HOST: ${{ secrets.WEB_SSH_HOST }}
          REMOTE_ARTIFACT: ${{ steps.remote.outputs.REMOTE_ARTIFACT }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SSH_HOST:-}" ]]; then
            echo "WEB_SSH_HOST unavailable; skipping cleanup."
            exit 0
          fi

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "${DEPLOY_USER}@${SSH_HOST}" \
            "rm -f -- '$REMOTE_ARTIFACT'" \
            || true

          echo "Remote artifact cleanup attempted."

      # ====================================================================
      # 14. Cleanup GitHub runner
      # ====================================================================

      - name: Cleanup Runner Artifacts
        if: always()
        shell: bash
        run: |
          rm -f -- \
            "$ARTIFACT_NAME" \
            "$CHECKSUM_NAME"

          echo "Runner artifacts cleaned."