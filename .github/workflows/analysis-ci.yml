name: CI Analysis Service

on:
  pull_request:
    branches:
      - main
    paths:
      - "analysis/**"
      - ".github/workflows/analysis-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-analysis:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: analysis

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "analysis/uv.lock"

      - name: Install Project Dependencies
        run: |
          uv sync --frozen

      - name: Run Test Suite
        run: |
          uv run pytest -v -m "not e2e"

      - name: Build Analysis Docker Image
        run: |
          docker build \
            --tag resumeranker-analysis-ci:${{ github.run_number }} \
            .

      - name: Verify Docker Image
        run: |
          docker image inspect \
            "resumeranker-analysis-ci:${{ github.run_number }}" \
            > /dev/null

          echo "Analysis Docker image built successfully."
