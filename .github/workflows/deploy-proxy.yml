name: "Deploy: Proxy"

on:
  workflow_dispatch:
    inputs:
      artifact_url:
        description: "Public URL to the proxy artifact, e.g. https://github.com/org/repo/releases/download/proxy-v1.2.3/proxy.tar.gz"
        required: true
        type: string
      target_host:
        description: "Target server IP address"
        required: true
        type: string
  workflow_run:
    workflows: ["Build: Proxy"]
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy-proxy:
    name: Deploy Proxy Config
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') }}

    steps:
      - name: Determine Deployment Artifact URL and Host
        id: prep
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ARTIFACT_URL=${{ inputs.artifact_url }}" >> "$GITHUB_OUTPUT"
            echo "TARGET_HOST=${{ inputs.target_host }}" >> "$GITHUB_OUTPUT"
          else
            TAG="${{ github.event.workflow_run.head_branch }}"
            echo "ARTIFACT_URL=https://github.com/${{ github.repository }}/releases/download/${TAG}/proxy.tar.gz" >> "$GITHUB_OUTPUT"
            echo "TARGET_HOST=${{ secrets.PROXY_DEPLOY_HOST }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy proxy artifact to target host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.prep.outputs.TARGET_HOST }}
          username: deployer
          key: ${{ secrets.PROXY_DEPLOYER_SSH_KEY }}
          script: |
            deployproxy \
              --name resumeranker \
              --type raw \
              --artifact "${{ steps.prep.outputs.ARTIFACT_URL }}" \
              --proxy-ext caddyfile \
              --validator-check "command -v caddy" \
              --validator-command "caddy validate --config %s --adapter caddyfile"
