name: "Deploy: Proxy"

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to deploy (e.g. proxy-v1.0.1)"
        required: true
        type: string
      target_host:
        description: "Target server IP address"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-proxy:
    name: Deploy Proxy Config
    runs-on: ubuntu-24.04

    steps:
      - name: Determine Deployment Artifact URL and Host
        id: prep
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_HOST: ${{ inputs.target_host }}
        run: |
          set -euo pipefail

          if [[ ! "${RELEASE_TAG}" =~ ^proxy-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid release tag: ${RELEASE_TAG}"
            echo "Expected format: proxy-vX.Y.Z"
            exit 1
          fi

          if [ -z "${TARGET_HOST}" ]; then
            echo "ERROR: Target host is empty."
            exit 1
          fi

          ARTIFACT_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/Caddyfile"

          echo "RELEASE_TAG=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "ARTIFACT_URL=${ARTIFACT_URL}" >> "${GITHUB_OUTPUT}"
          echo "TARGET_HOST=${TARGET_HOST}" >> "${GITHUB_OUTPUT}"

      - name: Deploy Proxy Artifact
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.prep.outputs.TARGET_HOST }}
          username: deployer
          key: ${{ secrets.PROXY_DEPLOYER_SSH_KEY }}
          script: |
            set -euo pipefail

            deployproxy \
              --name resumeranker \
              --artifact "${{ steps.prep.outputs.ARTIFACT_URL }}" \
              --proxy-ext caddyfile \
              --validator-check "command -v caddy" \
              --validator-command "caddy validate --config %s --adapter caddyfile"
