name: Resume Ranker Analysis Service

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag to deploy (e.g., analysis-v1.0.0)"
        required: true
        type: string

env:
  SERVICE_NAME: "resumeranker-analysis"          
  SYSTEMD_SERVICE: "resumeranker-analysis.service"  

jobs:
  deploy:
    runs-on: ubuntu-24.04

    steps:
      - name: Resolve Deployment Version
        id: context
        run: |
          if [ "${{ github.event_name }}" == 'release' ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ inputs.version_tag }}"
          fi
          echo "VERSION=$TAG" >> $GITHUB_OUTPUT
          echo "Resolved production deployment version: $TAG"

      - name: Validate Production Safety Guardrail
        run: |
          TAG="${{ steps.context.outputs.VERSION }}"
          if [[ "$TAG" =~ -(dev|test|stag|rc|alpha|beta|preview) ]]; then
            echo "ERROR: Blocked alias or pre-release tag ($TAG) from hitting production!"
            exit 1
          fi
          echo "Production guardrail passed successfully. Clean production tag verified."

      - name: Download Pre-built Release Asset & Checksum
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          VERSION="${{ steps.context.outputs.VERSION }}"
          REPO="${{ github.repository }}"
          echo "Fetching immutable asset and checksum for version: $VERSION"
          gh release download "$VERSION" --repo "$REPO" --pattern "*.tar.gz"
          mv *.tar.gz artifact.tar.gz
          gh release download "$VERSION" --repo "$REPO" --pattern "*.sha256" || true
          if [ -f *.sha256 ] 2>/dev/null; then mv *.sha256 artifact.tar.gz.sha256; fi
          if [ ! -f "artifact.tar.gz" ]; then
            echo "Error: No .tar.gz artifact found attached to release $VERSION"
            exit 1
          fi
          if [ -f "artifact.tar.gz.sha256" ]; then
            CHECKSUM=$(awk '{print $1}' artifact.tar.gz.sha256)
          else
            CHECKSUM=$(sha256sum artifact.tar.gz | awk '{print $1}')
          fi
          echo "SHA256_HASH=$CHECKSUM" >> $GITHUB_ENV

      - name: Configure SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ANALYSIS_SSH_PRIVATE_KEY }}

      - name: Securely Trust Remote Host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.ANALYSIS_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload Artifact to Target Server
        run: |
          echo "Uploading verified artifact to remote host..."
          scp artifact.tar.gz deploy@${{ secrets.ANALYSIS_SSH_HOST }}:/home/deploy/artifact.tar.gz

      - name: Execute Server Deployment Engine
        env:
          VERSION: ${{ steps.context.outputs.VERSION }}
          CHECKSUM: ${{ env.SHA256_HASH }}
        run: |
          set -eo pipefail
          echo "Triggering remote deployment script via deploy user..."
          ssh deploy@${{ secrets.ANALYSIS_SSH_HOST }} << EOF
            set -eo pipefail
            /opt/platform/deploy.sh \
              --service "${{ env.SERVICE_NAME }}" \
              --version "$VERSION" \
              --artifact "/home/deploy/artifact.tar.gz" \
              --sha256 "$CHECKSUM" \
              --systemd "${{ env.SYSTEMD_SERVICE }}"
            # Clean up after a successful deployment
            rm -f /home/deploy/artifact.tar.gz
          EOF

      - name: Cleanup Runner Artifacts
        if: always()
        run: |
          rm -f artifact.tar.gz artifact.tar.gz.sha256