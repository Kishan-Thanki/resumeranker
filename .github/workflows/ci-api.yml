name: CI API Service

on:
  pull_request:
    branches:
      - main
    paths:
      - "api/**"
      - ".github/workflows/ci-api.yml"

jobs:
  test-api:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: api/go.sum

      - name: Download Go Dependencies
        run: |
          go mod download

      - name: Run Go Test Suite
        run: |
          go test -v -race ./internal/...

      - name: Verify Production Linux AMD64 Build
        run: |
          CGO_ENABLED=0 \
          GOOS=linux \
          GOARCH=amd64 \
          go build \
            -o /tmp/resumeranker-api \
            ./cmd/api

      - name: Verify Production Binary Exists
        run: |
          test -s /tmp/resumeranker-api
