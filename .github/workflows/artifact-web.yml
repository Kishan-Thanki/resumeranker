name: Build Web Artifact

on:
  push:
    tags:
      - "web-v*"

permissions:
  contents: write

jobs:
  build-web:
    name: Build and publish web artifact
    runs-on: ubuntu-24.04

    steps:
      # ====================================================================
      # 1. Checkout
      # ====================================================================

      - name: Checkout Code
        uses: actions/checkout@v4

      # ====================================================================
      # 2. Validate production tag
      # ====================================================================

      - name: Validate Web Release Tag
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^web-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid Web production release tag:"
            echo "  $TAG"
            echo
            echo "Expected format: web-vX.Y.Z"
            exit 1
          fi

          echo "Valid Web production release tag:"
          echo "  $TAG"

      # ====================================================================
      # 3. Validate application files
      # ====================================================================

      - name: Validate Web Runtime Files
        shell: bash
        run: |
          set -euo pipefail

          test -d web/public
          test -f web/public/index.html

          echo "Web public directory validated."

      # ====================================================================
      # 4. Build deterministic artifact
      # ====================================================================

      - name: Package Clean Web Artifact
        shell: bash
        run: |
          set -euo pipefail

          rm -rf -- build_stage

          rm -f -- \
            web-artifact.tar.gz \
            web-artifact.tar.gz.sha256

          mkdir -p build_stage

          cp -a web/public build_stage/

          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf web-artifact.tar.gz \
            -C build_stage \
            public/

          sha256sum web-artifact.tar.gz \
            > web-artifact.tar.gz.sha256

          echo "Web artifact created."

          ls -lh \
            web-artifact.tar.gz \
            web-artifact.tar.gz.sha256

      # ====================================================================
      # 5. Verify artifact
      # ====================================================================

      - name: Verify Web Artifact
        shell: bash
        run: |
          set -euo pipefail

          echo "Verifying SHA256..."
          sha256sum -c web-artifact.tar.gz.sha256

          echo
          echo "Validating archive contents..."

          tar \
            -tzf web-artifact.tar.gz \
            > /tmp/web-artifact-files.txt

          test -s /tmp/web-artifact-files.txt

          grep -q '^public/index.html$' \
            /tmp/web-artifact-files.txt

          if grep -qE '(^|/)(__pycache__|[^/]+\.pyc)$' \
              /tmp/web-artifact-files.txt; then
            echo "ERROR: Python cache files were included."
            exit 1
          fi

          if grep -qE '(^|/)\.env$' \
              /tmp/web-artifact-files.txt; then
            echo "ERROR: .env was included."
            exit 1
          fi

          if grep -qE '(^|/)(node_modules|\.git)(/|$)' \
              /tmp/web-artifact-files.txt; then
            echo "ERROR: Development/repository files were included."
            exit 1
          fi

          echo
          echo "Web artifact verified."

          echo
          echo "Artifact contents:"
          cat /tmp/web-artifact-files.txt

      # ====================================================================
      # 6. Create GitHub Release and upload assets
      # ====================================================================

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            web-artifact.tar.gz
            web-artifact.tar.gz.sha256
          body: |
            Automated production build for Web service release ${{ github.ref_name }}

      # ====================================================================
      # 7. Cleanup runner
      # ====================================================================

      - name: Cleanup Runner Artifacts
        if: always()
        shell: bash
        run: |
          rm -rf -- build_stage

          rm -f -- \
            web-artifact.tar.gz \
            web-artifact.tar.gz.sha256 \
            /tmp/web-artifact-files.txt

          echo "Runner artifacts cleaned."