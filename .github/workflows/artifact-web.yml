name: Build Web Artifact

on:
  push:
    tags:
      - "web-v*"

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Web Release Tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^web-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid Web production release tag: $TAG"
            echo "Expected format: web-vX.Y.Z"
            exit 1
          fi

          echo "Valid Web production release tag: $TAG"

      - name: Validate Web Runtime Files
        run: |
          set -euo pipefail

          test -d web/public
          test -f web/public/index.html

          echo "Web public directory validated."

      - name: Package Clean Web Artifact
        run: |
          set -euo pipefail

          rm -rf build_stage
          rm -f web-artifact.tar.gz
          rm -f web-artifact.tar.gz.sha256

          mkdir -p build_stage

          cp -r web/public build_stage/

          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf web-artifact.tar.gz \
            -C build_stage \
            public/

          sha256sum web-artifact.tar.gz \
            > web-artifact.tar.gz.sha256

      - name: Verify Web Artifact
        run: |
          set -euo pipefail

          sha256sum -c web-artifact.tar.gz.sha256

          tar -tzf web-artifact.tar.gz \
            > /tmp/web-artifact-files.txt

          grep -q '^public/index.html$' \
            /tmp/web-artifact-files.txt

          grep -q '^public/assets/' \
            /tmp/web-artifact-files.txt

          if grep -qE '(^|/)(__pycache__|[^/]+\.pyc)$' \
              /tmp/web-artifact-files.txt; then
            echo "ERROR: Unexpected Python cache files were included."
            exit 1
          fi

          if grep -qE '(^|/)\.env$' \
              /tmp/web-artifact-files.txt; then
            echo "ERROR: .env was included in the production artifact."
            exit 1
          fi

          if grep -qE '(^|/)(node_modules|\.git)(/|$)' \
              /tmp/web-artifact-files.txt; then
            echo "ERROR: Development/repository files were included."
            exit 1
          fi

      - name: Create GitHub Release & Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            web-artifact.tar.gz
            web-artifact.tar.gz.sha256
          body: |
            Automated production build for Web service release ${{ github.ref_name }}
