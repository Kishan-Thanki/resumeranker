# Single compose. Builds the multi-stage Dockerfile and runs it. No bind
# mounts, no --reload, no --watch. api and worker share the same image,
# different CMD.
#
# To see code changes you must rebuild:
#   docker compose up -d --build

name: resume-ranker-backend

services:
  api:
    build:
      context: .
    image: resume-ranker-backend
    container_name: api
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - resume-ranker
    # `--no-server-header` strips `Server: uvicorn` from responses. Combined
    # with the generic error handlers in app/main.py, this removes the
    # easiest framework-fingerprinting signal.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-server-header", "--no-date-header"]
    restart: unless-stopped
    # FastAPI + DB pool + no LLM. ~100 MiB idle. Cap is generous so a
    # spike in concurrent requests doesn't kill the container.
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    pids_limit: 200

  worker:
    image: resume-ranker-backend
    container_name: worker
    env_file: .env
    depends_on:
      api:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - resume-ranker
    command: ["arq", "app.worker.WorkerSettings"]
    restart: unless-stopped
    # Heavy lifter — LLM pipeline, pdfplumber, JSON shaping. Up to
    # ~400 MiB during a run. 1 GiB cap leaves headroom for big PDFs.
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 1.0
    pids_limit: 200

  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    # Credentials come from .env so secrets are not committed to the repo.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    ports:
      # Host port 15432 → container 5432 to avoid clashing with any other
      # Postgres on the host. Internal services use `postgres:5432`.
      - "15432:5432"
    volumes:
      - resume-ranker-postgres-data:/var/lib/postgresql/data
    networks:
      - resume-ranker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Small v1 dataset. Bump mem_limit when you load real data — Postgres
    # uses memory for shared_buffers + work_mem and benefits from more.
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    pids_limit: 200

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      # Host port 16379 → container 6379.
      - "16379:6379"
    volumes:
      - resume-ranker-redis-data:/data
    networks:
      - resume-ranker
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    # Tiny footprint — queue + counters + cache. 128 MiB is plenty
    # for v1; bump if cache hit rate is high and entries are large.
    mem_limit: 128m
    mem_reservation: 32m
    cpus: 0.25
    pids_limit: 100

networks:
  resume-ranker:
    name: resume-ranker

volumes:
  resume-ranker-postgres-data:
    name: resume-ranker-postgres-data
  resume-ranker-redis-data:
    name: resume-ranker-redis-data
