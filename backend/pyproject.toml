[project]
name = "resumeranker-backend"
version = "0.1.0"
description = "ResumeRanker backend: FastAPI + arq + Postgres + Redis. Matches the frontend's AnalysisResult contract."
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.115",
    "uvicorn[standard]~=0.32",
    "sqlalchemy~=2.0",
    "asyncpg~=0.30",
    "alembic~=1.13",
    "pydantic~=2.9",
    "pydantic-settings~=2.6",
    "arq~=0.26",
    "redis~=5.2",
    "litellm>=1.50",
    "instructor>=1.6",
    "anthropic~=0.40",
    "pdfplumber~=0.11",
    "resend>=2.4",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "email-validator>=2.2",
    "cryptography>=43",
    "passlib[bcrypt]>=1.7.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "reportlab>=4.5.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]   # autogenerated by Alembic

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",
    # Allow typographic em/en dashes in string literals and comments. Used
    # intentionally in prompt copy and fixture content (e.g. "2017–2020").
    "RUF001",
    "RUF003",
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "resend.*", "litellm.*", "instructor.*", "arq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "eval: end-to-end LLM eval tests (excluded by default; use -m eval to run)",
]
addopts = "-m 'not eval'"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
