services:
  postgres:
    image: postgres:18-alpine
    container_name: resumeranker-db
    volumes:
      - resumeranker-db-data:/var/lib/postgresql/data
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: resumeranker
    restart: unless-stopped

volumes:
  resumeranker-db-data: