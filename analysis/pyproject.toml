[project]
name = "resumeranker-analysis"
version = "0.1.0"
description = "Analysis engine for ResumeRanker"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.64.1",
    "grpcio-health-checking>=1.64.1",
    "grpcio-tools>=1.64.1",
    "litellm>=1.40.0",
    "instructor>=1.3.0",
    "pypdfium2>=4.30.0",
    "pydantic>=2.7.0",
    "uvloop>=0.22.1",
    "phonenumbers>=9.0.36",
    "protobuf>=5.29.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "e2e: tests that require a running service and real LLM provider access",
]

[dependency-groups]
dev = [
    "mypy-protobuf>=5.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.0.0",
]
