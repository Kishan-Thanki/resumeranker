[project]
name = "resumeranker-analysis"
version = "0.1.0"
description = "Analysis engine for ResumeRanker"
requires-python = ">=3.12"
dependencies = [
    "grpcio>=1.64.1",
    "grpcio-tools>=1.64.1",
    "litellm>=1.40.0",
    "instructor>=1.3.0",
    "pypdfium2>=4.30.0",
    "pydantic>=2.7.0",
    "uvloop>=0.22.1",
    "fastapi>=0.111.0",
    "orjson>=3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
